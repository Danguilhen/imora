[package]
name = "imora"
version = "0.1.0"
edition = "2021"
description = "A lightweight, elegant media gallery"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "pnm", "dds", "tga", "exr"] }
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
